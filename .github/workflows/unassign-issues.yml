name: Auto-Unassign Inactive Issues

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: unassign-issues
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  unassign-inactive:
    runs-on: ubuntu-latest
    steps:
      - name: Unassign inactive contributors
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const INACTIVITY_DAYS = 7;
            const cutoff = new Date(Date.now() - INACTIVITY_DAYS * 24 * 60 * 60 * 1000);

            // Fetch all open assigned issues
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });

            // Get collaborators/maintainers to exempt
            const collabs = await github.paginate(github.rest.repos.listCollaborators, {
              owner, repo, per_page: 100
            }).catch(() => []);
            const exemptLogins = new Set(collabs.map(c => c.login));

            for (const issue of issues) {
              if (!issue.assignees || issue.assignees.length === 0) continue;
              if (issue.pull_request) continue; // skip PRs

              // Fetch comments to find last activity
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });

              const lastActivity = comments.length > 0
                ? new Date(comments[comments.length - 1].created_at)
                : new Date(issue.created_at);

              if (lastActivity >= cutoff) continue; // still active

              for (const assignee of issue.assignees) {
                if (exemptLogins.has(assignee.login)) continue; // skip maintainers

                await github.rest.issues.removeAssignees({
                  owner, repo, issue_number: issue.number, assignees: [assignee.login]
                });

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `⏰ @${assignee.login} — you've been **automatically unassigned** from this issue due to **${INACTIVITY_DAYS}+ days of inactivity**.\n\nIf you're still working on this, please comment \`/assign\` to reclaim it. Otherwise, this issue is open for other contributors! 🙌`
                });
              }
            }
