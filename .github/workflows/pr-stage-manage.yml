name: PR Stage Manager

on:
  pull_request_target:
    types: [labeled, unlabeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  manage-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Handle stage transitions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) return;

            const prNumber = pr.number;
            const addedLabel = context.payload.label?.name;
            const currentLabels = pr.labels?.map(l => l.name) || [];

            const ensureLabel = async (name, color = 'EDEDED', description = '') => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color, description }); }
            };

            // Stage 1 → Stage 2: stage-1-approved added
            if (addedLabel === 'stage-1-approved') {
              await ensureLabel('needs-mentor-review', '1D76DB', 'Waiting for mentor review');
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['needs-mentor-review'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `✅ **Stage 1 Passed!**\n\nThis PR has passed automated checks and is now in **Stage 2 — Mentor Review**. A mentor will be assigned shortly. 🔍`
              });
            }

            // Stage 2 → Stage 3: mentor-approved added
            if (addedLabel === 'mentor-approved') {
              await ensureLabel('pa-review-required', 'F9D0C4', 'Awaiting Project Admin review');
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['pa-review-required'] });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'needs-mentor-review' }); } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `🎉 **Stage 2 Passed — Mentor Approved!**\n\nThis PR is now in **Stage 3 — Project Admin Review**. The PA will make the final merge decision. ⏳`
              });
            }

            // Stage 3 complete: pa-approved added
            if (addedLabel === 'pa-approved') {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: 'pa-review-required' }); } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `🚀 **Stage 3 Complete — PA Approved!**\n\nThis PR has received Project Admin approval and is **ready to merge**. 🎉`
              });
            }
