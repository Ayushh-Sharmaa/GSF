name: Assignment Timeout Escalation

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:

concurrency:
  group: assignment-timeout-escalation
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  escalate-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Escalate stale pending assignments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const PROJECT_ADMIN = 'S3DFX-CYBER';
            const TIMEOUT_HOURS = 24;
            const cutoff = new Date(Date.now() - TIMEOUT_HOURS * 60 * 60 * 1000);

            // Find all open issues with 'pending-assignment' label
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'pending-assignment', per_page: 100
            });

            for (const issue of issues) {
              // Find the pending-assignment label application time
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: issue.number, per_page: 100
              });

              const labelEvent = events
                .filter(e => e.event === 'labeled' && e.label?.name === 'pending-assignment')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!labelEvent || new Date(labelEvent.created_at) >= cutoff) continue;

              // Check if already escalated
              const currentLabels = issue.labels.map(l => l.name);
              if (currentLabels.includes('escalated') || currentLabels.includes('needs-admin')) continue;

              // Check if any mentor responded since the label was applied
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const labelTime = new Date(labelEvent.created_at);
              const mentorResponse = comments.find(c =>
                new Date(c.created_at) > labelTime &&
                c.user.login !== 'github-actions[bot]'
              );
              if (mentorResponse) continue; // mentor already responded

              // Escalate
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['escalated', 'needs-admin']
              });

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🚨 **Escalation Notice** — No mentor has responded to this assignment request in over **${TIMEOUT_HOURS} hours**.\n\n@${PROJECT_ADMIN} please review this manually. 🙏`
              });
            }
