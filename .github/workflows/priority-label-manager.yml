name: Priority Label Manager

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

concurrency:
  group: priority-label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  apply-priority:
    runs-on: ubuntu-latest
    steps:
      - name: Apply priority label based on keywords
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const item = context.payload.issue || context.payload.pull_request;
            const text = `${item.title} ${item.body || ''}`.toLowerCase();

            const HIGH_KEYWORDS   = ['crash', 'broken', 'security', 'urgent', 'critical', 'vulnerability', 'down', 'data loss'];
            const MEDIUM_KEYWORDS = ['bug', 'fix', 'error', 'fail', 'incorrect', 'regression', 'unexpected'];

            let priority;
            if (HIGH_KEYWORDS.some(k => text.includes(k))) {
              priority = { label: 'priority:high', color: 'B60205', description: 'High priority — urgent' };
            } else if (MEDIUM_KEYWORDS.some(k => text.includes(k))) {
              priority = { label: 'priority:medium', color: 'FBCA04', description: 'Medium priority' };
            } else {
              priority = { label: 'priority:low', color: '0E8A16', description: 'Low priority' };
            }

            const issueNumber = item.number;
            const currentLabels = item.labels?.map(l => l.name) || [];

            // Remove old priority labels
            for (const lbl of currentLabels.filter(l => l.startsWith('priority:'))) {
              if (lbl === priority.label) continue;
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: lbl }); } catch {}
            }

            // Ensure label exists
            try { await github.rest.issues.getLabel({ owner, repo, name: priority.label }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: priority.label, color: priority.color, description: priority.description }); }

            if (!currentLabels.includes(priority.label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [priority.label] });
            }
