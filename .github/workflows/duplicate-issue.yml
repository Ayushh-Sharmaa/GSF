name: Duplicate Issue Detection

on:
  issues:
    types: [opened]

concurrency:
  group: dup-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    steps:
      - name: Find possible duplicate issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const newIssue = context.payload.issue;
            const newTitle = newIssue.title.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);
            const newBody = (newIssue.body || '').toLowerCase();

            // Fetch all other open issues
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });

            const duplicates = [];

            for (const issue of allIssues) {
              if (issue.number === newIssue.number) continue;
              if (issue.pull_request) continue;

              const existingTitle = issue.title.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);

              // Keyword overlap scoring
              const common = newTitle.filter(w => w.length > 3 && existingTitle.includes(w));
              const score = (2 * common.length) / (newTitle.length + existingTitle.length);

              if (score >= 0.5) {
                duplicates.push({ number: issue.number, title: issue.title, score: Math.round(score * 100) });
              }
            }

            if (duplicates.length > 0) {
              duplicates.sort((a, b) => b.score - a.score);
              const top = duplicates.slice(0, 5);

              try { await github.rest.issues.getLabel({ owner, repo, name: 'possible-duplicate' }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name: 'possible-duplicate', color: 'CFD3D7', description: 'Possible duplicate of an existing issue' }); }

              await github.rest.issues.addLabels({ owner, repo, issue_number: newIssue.number, labels: ['possible-duplicate'] });

              const list = top.map(d => `- #${d.number} — **${d.title}** (${d.score}% similarity)`).join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: newIssue.number,
                body: `🔍 **Possible Duplicate Detected**\n\nThis issue may already be reported:\n\n${list}\n\nPlease check if any of these cover your issue. If it's genuinely different, you can remove the \`possible-duplicate\` label and explain why. 🙏`
              });
            }
