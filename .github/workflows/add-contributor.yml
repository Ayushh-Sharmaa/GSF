name: Add Contributor to README

on:
  workflow_dispatch:
    inputs:
      pr_author:
        description: 'GitHub username of the contributor to add'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  add-contributor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add contributor avatar to README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            // Determine username — from input or from latest merged PR
            let username = context.payload.inputs?.pr_author || '';

            if (!username) {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'closed', per_page: 10
              });
              const latestMerged = prs.find(p => p.merged_at);
              if (!latestMerged) { console.log('No merged PR found.'); return; }
              username = latestMerged.user.login;
            }

            if (username === 'github-actions[bot]') return;

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            const startMarker = '<!-- CONTRIBUTORS_START -->';
            const endMarker   = '<!-- CONTRIBUTORS_END -->';

            if (!readme.includes(startMarker)) {
              console.log('No CONTRIBUTORS_START marker found in README.md — skipping.');
              return;
            }

            // Check if already present
            if (readme.includes(`github.com/${username}`)) {
              console.log(`${username} is already in contributors section.`);
              return;
            }

            const avatarHtml = `<a href="https://github.com/${username}"><img src="https://github.com/${username}.png" width="50px" alt="${username}" /></a>\n`;
            readme = readme.replace(endMarker, avatarHtml + endMarker);

            fs.writeFileSync(readmePath, readme);
            console.log(`Added ${username} to contributors.`);

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: add contributor to README [skip ci]"
          git push
