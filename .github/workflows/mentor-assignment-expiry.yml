name: Mentor Assignment Expiry & Rotation

on:
  schedule:
    - cron: '30 */6 * * *'   # Every 6 hours (offset from escalation)
  workflow_dispatch:

concurrency:
  group: mentor-assignment-expiry
  cancel-in-progress: true

permissions:
  issues: write
  contents: write

jobs:
  rotate-mentors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rotate unresponsive mentors
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const TIMEOUT_HOURS = 24;
            const cutoff = new Date(Date.now() - TIMEOUT_HOURS * 60 * 60 * 1000);

            const mentorData = JSON.parse(fs.readFileSync('.github/reviewers/gssoc-mentors.json', 'utf8'));
            const activeMentors = mentorData.mentors.filter(m => m.active).map(m => m.username);

            const pendingData = JSON.parse(fs.readFileSync('.github/reviewers/pending-assignments.json', 'utf8'));
            const pending = pendingData.pending || [];

            let updated = false;
            for (const entry of pending) {
              if (!entry.mentorPinged || new Date(entry.pinnedAt) >= cutoff) continue;
              if (entry.resolved) continue;

              // Check if mentor responded
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: entry.issueNumber, per_page: 100
              });
              const responded = comments.find(c =>
                c.user.login === entry.mentorPinged &&
                new Date(c.created_at) > new Date(entry.pinnedAt)
              );
              if (responded) {
                entry.resolved = true;
                updated = true;
                continue;
              }

              // Select a new mentor (not the previous one)
              const otherMentors = activeMentors.filter(m => m !== entry.mentorPinged);
              if (otherMentors.length === 0) continue;
              const newMentor = otherMentors[Math.floor(Math.random() * otherMentors.length)];

              entry.mentorPinged = newMentor;
              entry.pinnedAt = new Date().toISOString();
              updated = true;

              await github.rest.issues.createComment({
                owner, repo, issue_number: entry.issueNumber,
                body: `🔄 Mentor rotation: @${newMentor} has been assigned to review this assignment request (previous mentor did not respond within ${TIMEOUT_HOURS}h). Please review when available! 🙏`
              });
            }

            if (updated) {
              pendingData.updatedAt = new Date().toISOString();
              fs.writeFileSync('.github/reviewers/pending-assignments.json', JSON.stringify(pendingData, null, 2));
            }

      - name: Commit updated pending-assignments.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/reviewers/pending-assignments.json
          git diff --cached --quiet || git commit -m "chore: rotate unresponsive mentors [skip ci]"
          git push
