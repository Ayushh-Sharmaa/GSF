name: DCO Helper

on:
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check-dco:
    runs-on: ubuntu-latest
    steps:
      - name: Check DCO sign-off on all commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100
            });

            const missing = commits.filter(c => {
              const msg = c.commit.message || '';
              return !/signed-off-by:/i.test(msg);
            });

            const ensureLabel = async (name, color) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color }); }
            };

            if (missing.length > 0) {
              await ensureLabel('dco-missing', 'D93F0B');
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['dco-missing'] });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'dco-ok' }); } catch {}

              const shas = missing.map(c => `- \`${c.sha.slice(0,7)}\` — ${c.commit.message.split('\n')[0]}`).join('\n');

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `⚠️ **DCO Sign-off Missing**\n\nThe following commit(s) are missing a \`Signed-off-by:\` line:\n${shas}\n\n**How to fix:**\n\`\`\`bash\n# For the last commit:\ngit commit --amend --signoff\ngit push --force-with-lease\n\n# For multiple commits (replace N with the count):\ngit rebase HEAD~${missing.length} --signoff\ngit push --force-with-lease\n\`\`\`\n\nBy signing off, you certify that you have the right to submit this contribution under the project's license. See [DCO](https://developercertificate.org/). ✍️`
              });
            } else {
              await ensureLabel('dco-ok', '0E8A16');
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['dco-ok'] });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'dco-missing' }); } catch {}
            }
