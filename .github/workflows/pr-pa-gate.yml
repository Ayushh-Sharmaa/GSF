name: PR PA Gate (Stage 3)

on:
  pull_request_target:
    types: [labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: pr-pa-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PA approval status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) return;

            const labels = pr.labels.map(l => l.name);
            const hasPA = labels.includes('pa-approved');

            if (hasPA) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `✅ **Stage 3 Complete** — This PR has received **Project Admin approval** and is ready to merge! 🚀`
              });
            } else if (labels.includes('pa-review-required')) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `⏳ **Stage 3 — Awaiting Project Admin Approval**\n\nThis PR is pending final approval from @S3DFX-CYBER before it can be merged.`
              });
            }
