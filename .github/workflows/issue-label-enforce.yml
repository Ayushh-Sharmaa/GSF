name: Issue Label Enforcement

on:
  issues:
    types: [opened, labeled, unlabeled]

concurrency:
  group: issue-label-enforce-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  enforce-labels:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    steps:
      - name: Check required label categories
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            const hasDifficulty = labels.some(l => l.startsWith('level:'));
            const hasType = labels.some(l => l.startsWith('type:'));

            const ensureLabel = async (name, color, description = '') => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color, description }); }
            };

            if (!hasDifficulty || !hasType) {
              await ensureLabel('needs-labels', 'E4E669', 'Issue/PR missing required labels');
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['needs-labels'] });

              const missing = [];
              if (!hasDifficulty) missing.push('a **difficulty label** (`level:beginner`, `level:intermediate`, or `level:advanced`)');
              if (!hasType) missing.push('a **type label** (`type:bug`, `type:feature`, `type:docs`, etc.)');

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `🏷️ @${issue.user.login} — this issue is missing required labels:\n\n${missing.map(m => `- ${m}`).join('\n')}\n\nA maintainer will apply these labels shortly. If you have write access, please add them. 🙏`
              });
            } else {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: 'needs-labels' }); } catch {}
            }
