name: Issue Context Assignment

on:
  issue_comment:
    types: [created]

concurrency:
  group: assignment-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  handle-assign:
    runs-on: ubuntu-latest
    if: |
      !github.event.sender.type == 'Bot' &&
      (
        startsWith(github.event.comment.body, '/assign') ||
        startsWith(github.event.comment.body, '/assign gssoc') ||
        startsWith(github.event.comment.body, '/assign nsoc')
      )

    steps:
      - name: Process assignment request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            const commentBody = context.payload.comment.body.trim();

            // Parse command
            const match = commentBody.match(/^\/assign(\s+(gssoc|nsoc))?/i);
            if (!match) return;

            const issue = context.payload.issue;

            // Skip if already assigned
            if (issue.assignees && issue.assignees.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `❌ @${commenter} — this issue is already assigned to **@${issue.assignees[0].login}**. Please pick another issue.`
              });
              return;
            }

            // Check active assignment count for this user
            const openIssues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', assignee: commenter, per_page: 100
            });
            if (openIssues.data.length >= 3) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `❌ @${commenter} — you already have **${openIssues.data.length} open assignments**. Please complete or unassign one before requesting more.`
              });
              return;
            }

            // Determine difficulty from labels
            const labels = issue.labels.map(l => l.name.toLowerCase());
            const isBeginner = labels.some(l => l.includes('beginner') || l.includes('level:beginner'));
            const isIntermediate = labels.some(l => l.includes('intermediate') || l.includes('level:intermediate'));
            const isAdvanced = labels.some(l => l.includes('advanced') || l.includes('level:advanced'));

            // Beginner: auto-assign immediately
            if (isBeginner) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: issueNumber, assignees: [commenter] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `✅ @${commenter} — you've been assigned to this **beginner** issue! Please submit your PR within **7 days**. Good luck! 🎉`
              });
              return;
            }

            // Intermediate: check account age (30+ days)
            if (isIntermediate) {
              const userData = await github.rest.users.getByUsername({ username: commenter });
              const accountAge = (Date.now() - new Date(userData.data.created_at).getTime()) / (1000 * 60 * 60 * 24);
              if (accountAge < 30) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `❌ @${commenter} — intermediate issues require a GitHub account at least **30 days old**. Your account is ${Math.floor(accountAge)} days old. Please start with a beginner issue!`
                });
                return;
              }
              // Queue for mentor approval
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['pending-assignment'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `⏳ @${commenter} — your request for this **intermediate** issue has been queued for mentor approval. A mentor will review within 24 hours.`
              });
              return;
            }

            // Advanced: check for at least 1 merged PR
            if (isAdvanced) {
              const mergedPRs = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} type:pr author:${commenter} is:merged`
              });
              if (mergedPRs.data.total_count < 1) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `❌ @${commenter} — advanced issues require at least **1 merged PR** in this repository. Please contribute a smaller fix first!`
                });
                return;
              }
              // Queue for mentor approval
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['pending-assignment'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `⏳ @${commenter} — your request for this **advanced** issue has been queued for mentor approval. A mentor will review within 24 hours.`
              });
              return;
            }

            // No difficulty label — queue for mentor approval as default
            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['pending-assignment'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `⏳ @${commenter} — your assignment request has been queued for mentor approval. A mentor will review within 24 hours.`
            });
