name: PR Welcome Bot

on:
  pull_request_target:
    types: [opened]

concurrency:
  group: pr-welcome-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome for first-time PR authors
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            if (pr.user.type === 'Bot') return;

            // Check if this is their first PR
            const history = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} type:pr author:${author}`
            });
            const priorPRs = history.data.total_count - 1; // subtract this one
            if (priorPRs > 0) return;

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: pr.number,
              body: `🎉 **Welcome, @${author}!** This is your first PR to GSF — amazing!\n\nHere's what happens next:\n\n### 📋 Our 3-Stage Review Pipeline\n\n| Stage | What | Who |\n|-------|------|-----|\n| **Stage 1** | Automated checks (validation, DCO, size labeling) | 🤖 GitHub Actions |\n| **Stage 2** | Code review | 👩‍💻 A mentor |\n| **Stage 3** | Final approval | 🏛️ Project Admin |\n\n### ✅ Checklist before we start\n- [ ] Your PR links an issue with \`Closes #N\`\n- [ ] All commits have \`Signed-off-by:\` (see [DCO](https://developercertificate.org/))\n- [ ] You've tested your changes locally\n\n### ⏱️ Expected Timelines\n- Stage 1: Within minutes\n- Stage 2 (mentor review): 24–72 hours\n- Stage 3 (admin review): 24–48 hours after mentor approval\n\n📖 See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for full details. We appreciate your contribution! 💙`
            });
